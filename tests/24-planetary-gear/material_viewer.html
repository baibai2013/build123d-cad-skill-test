<!doctype html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行星齿轮 材质查看器</title>
<style>
  html,body{margin:0;height:100%;background:#1a1d22;color:#ddd;font-family:-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #ui{position:fixed;top:12px;left:12px;z-index:10;background:#262a31cc;backdrop-filter:blur(6px);
      padding:10px 14px;border-radius:10px;border:1px solid #3a3f47;font-size:13px}
  #ui label{margin-right:6px}
  select{background:#1a1d22;color:#ddd;border:1px solid #3a3f47;border-radius:6px;padding:4px 8px;font-size:13px}
  #hint{margin-top:6px;color:#8b949e;font-size:11px}
  canvas{display:block}
</style>
</head>
<body>
<div id="ui">
  <label>材质</label>
  <select id="mat">
    <option value="wood">木头 wood</option>
    <option value="glass">玻璃 glass</option>
  </select>
  <div id="hint">拖拽旋转 · 滚轮缩放 · 标准 glTF 渲染(贴图/透射/环境光)</div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d22);
// 环境光照(PBR/玻璃反射必需)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(160, 120, 160);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.DirectionalLight(0xffffff, 1.5).position?.set?.(1, 2, 1) ?? 0);
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(80, 160, 120); scene.add(dl);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const loader = new GLTFLoader();
let current = null;

function load(mat) {
  if (current) { scene.remove(current); current.traverse(o => { o.geometry?.dispose?.(); }); }
  loader.load(`output/planetary_${mat}.glb?t=${Date.now()}`, (gltf) => {
    const root = gltf.scene;
    // 居中 + 适配视距
    const box = new THREE.Box3().setFromObject(root);
    const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
    root.position.sub(c);
    const r = Math.max(s.x, s.y, s.z);
    camera.position.set(r * 1.6, r * 1.2, r * 1.6);
    controls.target.set(0, 0, 0); controls.update();
    scene.add(root); current = root;
  }, undefined, (e) => { document.getElementById('hint').textContent = '加载失败: ' + mat + '.glb(先生成该材质)'; });
}

document.getElementById('mat').onchange = e => load(e.target.value);
load('wood');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function tick(){ requestAnimationFrame(tick); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
